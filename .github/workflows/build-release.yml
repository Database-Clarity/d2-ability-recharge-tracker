name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package Windows x64
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve semantic version
        id: version
        run: |
          [xml]$project = Get-Content D2AbilityTracker.csproj
          $base = [version]$project.Project.PropertyGroup.VersionPrefix
          $patch = $base.Build
          $tags = @(git tag --list "v$($base.Major).$($base.Minor).*")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($tag in $tags) {
            if ($tag -match '^v(\d+)\.(\d+)\.(\d+)$') {
              $patch = [Math]::Max($patch, [int]$Matches[3] + 1)
            }
          }
          $version = "$($base.Major).$($base.Minor).$patch"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x

      - name: Restore projects
        run: dotnet restore tests\D2AbilityTracker.Tests.csproj

      - name: Check formatting
        run: |
          dotnet format D2AbilityTracker.csproj --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format tests\D2AbilityTracker.Tests.csproj --verify-no-changes --no-restore

      - name: Run automated checks
        run: dotnet run --project tests\D2AbilityTracker.Tests.csproj --configuration Release --no-restore

      - name: Publish single-file self-contained app
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish D2AbilityTracker.csproj --configuration Release --runtime win-x64 --self-contained true --output "$env:RUNNER_TEMP\publish" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:Version="$env:RELEASE_VERSION" -p:InformationalVersion="$env:RELEASE_VERSION+$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem "$env:RUNNER_TEMP\publish" -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "D2AbilityTracker.exe") {
            throw "Expected a standalone D2AbilityTracker.exe, but publish produced: $($files.Name -join ', ')"
          }
          Rename-Item "$env:RUNNER_TEMP\publish\D2AbilityTracker.exe" "D2AbilityTracker-v$env:RELEASE_VERSION.exe"

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          path: ${{ runner.temp }}\publish\D2AbilityTracker-v${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Windows package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64
          path: ${{ runner.temp }}\release

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          gh release create $tag "$env:RUNNER_TEMP\release\D2AbilityTracker-v$env:RELEASE_VERSION.exe" --target $env:GITHUB_SHA --title "Destiny 2 Ability Recharge Tracker $tag" --generate-notes --latest
