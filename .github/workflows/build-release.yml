name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package Windows x64
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve semantic version
        id: version
        run: |
          [xml]$project = Get-Content D2AbilityTracker.csproj
          $base = [version]$project.Project.PropertyGroup.VersionPrefix
          $patch = $base.Build
          $tags = @(git tag --list "v$($base.Major).$($base.Minor).*")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($tag in $tags) {
            if ($tag -match '^v(\d+)\.(\d+)\.(\d+)$') {
              $patch = [Math]::Max($patch, [int]$Matches[3] + 1)
            }
          }
          $version = "$($base.Major).$($base.Minor).$patch"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Restore projects
        run: dotnet restore tests\D2AbilityTracker.Tests.csproj

      - name: Check formatting
        run: |
          dotnet format D2AbilityTracker.csproj --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format tests\D2AbilityTracker.Tests.csproj --verify-no-changes --no-restore

      - name: Run automated checks
        run: |
          dotnet run --project tests\D2AbilityTracker.Tests.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests\D2AbilityTracker.Tests.csproj --configuration Release --no-build -- --ui-smoke "$env:RUNNER_TEMP\ui-smoke"

      - name: Publish framework-dependent app
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish D2AbilityTracker.csproj --configuration Release --runtime win-x64 --self-contained false --output "$env:RUNNER_TEMP\publish" -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:Version="$env:RELEASE_VERSION" -p:InformationalVersion="$env:RELEASE_VERSION+$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem "$env:RUNNER_TEMP\publish" -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "D2AbilityTracker.exe") {
            throw "Expected a standalone D2AbilityTracker.exe, but publish produced: $($files.Name -join ', ')"
          }

      - name: Publish self-contained portable app
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $portablePath = "$env:RUNNER_TEMP\portable"
          dotnet publish D2AbilityTracker.csproj --configuration Release --runtime win-x64 --self-contained true --output $portablePath -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:Version="$env:RELEASE_VERSION" -p:InformationalVersion="$env:RELEASE_VERSION+$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath "$portablePath\D2AbilityTracker.exe")) {
            throw "Portable publish did not produce D2AbilityTracker.exe."
          }
          New-Item -ItemType File -Path "$portablePath\portable.flag" | Out-Null
          @"
          Destiny 2 Ability Recharge Tracker $env:RELEASE_VERSION — Portable

          Extract this folder anywhere writable and run D2AbilityTracker.exe.
          This build includes the .NET runtime and requires no installation.
          Settings and measurement history are stored next to the executable.
          Copy the whole folder to move the app and its data together.
          "@ | Set-Content -LiteralPath "$portablePath\PORTABLE.txt" -Encoding utf8
          Compress-Archive -Path "$portablePath\*" -DestinationPath "$env:RUNNER_TEMP\D2AbilityTracker-v$env:RELEASE_VERSION-Portable-win-x64.zip" -CompressionLevel Optimal

      - name: Build installer with on-demand runtime download
        run: |
          & .\installer\Build-Installer.ps1 -Version '${{ steps.version.outputs.version }}' -PublishPath "$env:RUNNER_TEMP\publish" -OutputPath "$env:RUNNER_TEMP\installer"

      - name: Upload Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: |
            ${{ runner.temp }}\installer\D2AbilityTracker-v${{ steps.version.outputs.version }}-Setup.exe
            ${{ runner.temp }}\D2AbilityTracker-v${{ steps.version.outputs.version }}-Portable-win-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Windows package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: ${{ runner.temp }}\release

      - name: Check out changelog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare release notes from changelog
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $previousTag = git tag --list 'v*' |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Substring(1) } -Descending |
            Select-Object -First 1
          if (-not $previousTag) {
            throw 'Cannot prepare release notes because no previous semantic version tag exists.'
          }

          $changes = @(git diff --no-ext-diff --unified=0 "$previousTag..$env:GITHUB_SHA" -- CHANGELOG.md)
          if ($LASTEXITCODE -ne 0) { throw 'Could not compare the changelog with the previous release.' }
          $notes = @($changes |
            Where-Object { $_ -match '^\+-\s+\S' } |
            ForEach-Object { $_.Substring(1) })
          if ($notes.Count -gt 0) {
            $body = "## Changes`n`n" + ($notes -join "`n")
          } else {
            $body = 'No user-facing changes in this release.'
          }
          $commits = @(git log --reverse --format="- [%h](https://github.com/$env:GITHUB_REPOSITORY/commit/%H) %s" "$previousTag..$env:GITHUB_SHA")
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the commit history for this release.' }
          $body += "`n`n## Commit history`n`n" + ($commits -join "`n")
          $body += "`n`n[Full comparison](https://github.com/$env:GITHUB_REPOSITORY/compare/$previousTag...v$env:RELEASE_VERSION)"
          Set-Content -LiteralPath "$env:RUNNER_TEMP\release-notes.md" -Value $body -Encoding utf8

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          gh release create $tag `
            "$env:RUNNER_TEMP\release\installer\D2AbilityTracker-v$env:RELEASE_VERSION-Setup.exe" `
            "$env:RUNNER_TEMP\release\D2AbilityTracker-v$env:RELEASE_VERSION-Portable-win-x64.zip" `
            --target $env:GITHUB_SHA --title "Destiny 2 Ability Recharge Tracker $tag" `
            --notes-file "$env:RUNNER_TEMP\release-notes.md" --latest
